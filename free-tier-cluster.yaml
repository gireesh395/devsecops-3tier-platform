apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: devsecops-cluster
  region: eu-west-3
  version: "1.31"

iam:
  withOIDC: true

addons:
  - name: vpc-cni
    version: latest
  - name: kube-proxy
    version: latest
  - name: coredns
    version: latest
    configurationValues: |-
      replicaCount: 1

managedNodeGroups:
  - name: standard-workers
    instanceType: t3.micro
    desiredCapacity: 3
    minSize: 1
    maxSize: 3
    volumeSize: 20
    privateNetworking: false