apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: devsecops-cluster
  region: eu-west-3
  version: "1.31"

iam:
  withOIDC: true

addons:
  - name: vpc-cni
    configurationValues: '{"env":{"ENABLE_PREFIX_DELEGATION":"true","WARM_PREFIX_TARGET":"1"}}'
    resolveConflicts: overwrite
  - name: kube-proxy
  - name: coredns
    configurationValues: |-
      replicaCount: 1

managedNodeGroups:
  - name: standard-workers
    instanceType: t3.micro
    desiredCapacity: 3
    minSize: 2
    maxSize: 5
    maxPodsPerNode: 30
    volumeSize: 20
    iam:
      withAddonPolicies:
        autoScaler: true
        albIngress: true